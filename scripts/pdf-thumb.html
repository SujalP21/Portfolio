<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pending</title>
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 1200px; height: 850px; background: #ffffff; overflow: hidden; }
      #out { display: block; width: 1200px; height: 850px; background: #ffffff; }
    </style>
  </head>
  <body>
    <!-- Build-time only: renders page 1 of a PDF into a fixed 1200x850 white
         box (contain-fit) so every certificate thumbnail shares one aspect
         ratio. pdf.js is loaded from a CDN here and never ships to the site. -->
    <canvas id="out" width="1200" height="850"></canvas>
    <script type="module">
      import * as pdfjsLib from 'https://unpkg.com/pdfjs-dist@4.7.76/build/pdf.min.mjs'
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://unpkg.com/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs'

      const params = new URLSearchParams(location.search)
      const file = params.get('file')

      const out = document.getElementById('out')
      const ctx = out.getContext('2d')
      ctx.fillStyle = '#ffffff'
      ctx.fillRect(0, 0, out.width, out.height)

      try {
        const pdf = await pdfjsLib.getDocument(file).promise
        const page = await pdf.getPage(1)

        const base = page.getViewport({ scale: 1 })
        // Contain-fit into the fixed box, rendered at 2x then drawn down for
        // crisp text.
        const fit = Math.min(out.width / base.width, out.height / base.height)
        const viewport = page.getViewport({ scale: fit * 2 })

        const tmp = document.createElement('canvas')
        tmp.width = Math.floor(viewport.width)
        tmp.height = Math.floor(viewport.height)
        const tmpCtx = tmp.getContext('2d')
        tmpCtx.fillStyle = '#ffffff'
        tmpCtx.fillRect(0, 0, tmp.width, tmp.height)

        await page.render({ canvasContext: tmpCtx, viewport }).promise

        const w = tmp.width / 2
        const h = tmp.height / 2
        ctx.imageSmoothingQuality = 'high'
        ctx.drawImage(tmp, (out.width - w) / 2, (out.height - h) / 2, w, h)

        document.title = 'ok'
      } catch (err) {
        document.title = 'error: ' + err.message
      }
    </script>
  </body>
</html>
